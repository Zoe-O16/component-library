<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--fg:#000;--muted:#666;--line:#000;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--muted:#999;--line:#fff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--body);padding:40px max(16px,4vw) 64px}
.wrap{max-width:1100px;margin:0 auto}
h1{font:900 clamp(3.4rem,11vw,7.5rem)/.88 var(--display);text-transform:uppercase;margin:0}
.lead{max-width:60ch;margin:16px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.kit{display:grid;gap:12px;border:2px solid var(--line);padding:20px;color:inherit;text-decoration:none;transition:transform .4s cubic-bezier(.34,1.3,.64,1)}
.kit:hover,.kit:focus-visible{transform:rotate(-1.5deg)}
.kit h2{font:900 2.4rem/.9 var(--display);text-transform:uppercase;margin:0}
.chips{display:flex;gap:6px}.chips i{width:22px;height:22px;border-radius:50%;display:block}
.meta{font:500 .78rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kit p{margin:0}
.lib{font:500 .8rem var(--mono);color:inherit;margin-top:-8px}
.grid>div{display:grid;gap:12px}
</style></head><body><div class="wrap">
<h1>Component<br>Library</h1>
<p class="lead">Motion kits studied from websites I love and rebuilt as drop-in HTML, CSS and JS. Each kit has an overview page with live demos, plus one folder per component.</p>
<div class="grid" id="kits"></div>
</div>
<script>
// Add a kit: put it in kits/<slug>/, publish its own "<Site> Motion" library page, and add an entry here.
const KITS=[
  {slug:"fc-hyena",name:"FC Hyena",source:"fchyena.nl",date:"2026-10-22",count:10,
   colours:["#A0DC00","#FFA000","#00BEE6","#DC0000","#FFE100"],
   library:"https://claude.ai/artifact/PbgDp2jeUoMUUzSyhu5oT9",
   summary:"Boutique cinema in Amsterdam. Random colour per visit, draggable stickers, swinging menu blocks, typewriter hero."}
];
document.getElementById('kits').innerHTML=KITS.map(k=>`<div><a class="kit" href="kits/${k.slug}/">
  <div class="chips">${k.colours.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
  <h2>${k.name}</h2><p>${k.summary}</p>
  <div class="meta"><span>${k.source}</span><span>${k.count} components · ${k.date}</span></div></a>${k.library?`<a class="lib" href="${k.library}">${k.name} Motion library →</a>`:''}</div>`).join('');
</script>
</body></html>
