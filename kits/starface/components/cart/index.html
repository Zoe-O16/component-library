<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart drawer · Starface kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="style.css">
<style>body{margin:0;padding:40px max(16px,4vw)}</style>
</head><body>
<div class="sf-cart-demo">
  <button class="sf-pill sf-cart-open">bag (2)</button>
  <div class="sf-cart">
    <div class="sf-cart__overlay"></div>
    <div class="sf-cart__inner" role="dialog" aria-modal="true" aria-label="Bag">
      <div class="sf-cart__head"><h3>bag</h3><button class="sf-cart__close" aria-label="Close bag">×</button></div>
      <p class="sf-cart__line"><span class="sf-cart__thumb" style="--c:var(--sf-pink)"></span>spot patches · 32</p>
      <p class="sf-cart__line"><span class="sf-cart__thumb" style="--c:var(--sf-blue)"></span>gentle wash · 1</p>
      <button class="sf-pill sf-pill--dark">check out</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body></html>
