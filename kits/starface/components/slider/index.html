<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slider arrows and dots · Starface kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="style.css">
<style>body{margin:0;padding:40px max(16px,4vw)}</style>
</head><body>
<div class="sf-slider">
  <ul class="sf-slider__track">
    <li style="--c:var(--sf-pink)">1</li><li style="--c:var(--sf-blue)">2</li><li style="--c:var(--sf-green)">3</li><li style="--c:var(--sf-purple)">4</li><li style="--c:var(--sf-red)">5</li>
  </ul>
  <div class="sf-slider__buttons">
    <button class="sf-slider__btn sf-slider__btn--prev" aria-label="Previous slide"><svg class="sf-icon" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <div class="sf-slider__dots"></div>
    <button class="sf-slider__btn sf-slider__btn--next" aria-label="Next slide"><svg class="sf-icon" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  </div>
</div>
<script src="script.js"></script>
</body></html>
