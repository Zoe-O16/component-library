<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart line spinner · Starface kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="style.css">
<style>body{margin:0;padding:40px max(16px,4vw)}</style>
</head><body>
<div class="sf-line">
  <span class="sf-line__thumb"></span>
  <div class="sf-line__info"><b>spot patches</b>
    <div class="sf-qty"><button aria-label="Less">−</button><output>1</output><button aria-label="More">+</button></div></div>
  <div class="sf-line__end">
    <div class="sf-loading" hidden><svg class="sf-spinner" viewBox="0 0 66 66" aria-hidden="true"><circle class="sf-spinner__path" fill="none" stroke-width="6" cx="33" cy="33" r="30"/></svg><span class="sf-vh">Updating</span></div>
    <span class="sf-line__price">$12.00</span>
  </div>
</div>
<script src="script.js"></script>
</body></html>
